<div class="activity-selector">
    <label for="activity">Pawn activity:</label>
    <select id="activity" name="activity" class="form-control" aria-describedby="activity-help">
        {% for value, label in activity_choices %}
        <option value="{{ value }}"{% if value == activity %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>

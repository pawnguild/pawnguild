name: Deploy to production - digital ocean

on:
  push:
    branches: [production]

concurrency:
  group: pawnguild-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PawnGuild app only
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # reviewed master snapshot, 2026-08-16
        with:
          version: 1.8.4
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /home/pawnguild/pawnguild
            git fetch origin production
            if ! git diff --quiet HEAD origin/production -- services/app/Dockerfile services/app/requirements.txt; then
              echo "Runtime dependencies changed. Prepare and validate a runtime image separately before deployment."
              exit 1
            fi
            git merge --ff-only origin/production
            ./scripts/deploy-production.sh

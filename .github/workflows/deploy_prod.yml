name: Deploy to production - digital ocean

on:
  push:
    branches: [production]

concurrency:
  group: pawnguild-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PawnGuild app only
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /home/pawnguild/pawnguild
            git fetch origin production
            if ! git diff --quiet HEAD origin/production -- services/app/Dockerfile services/app/requirements.txt; then
              echo "Runtime dependencies changed. Prepare and validate a runtime image separately before deployment."
              exit 1
            fi
            git merge --ff-only origin/production
            ./scripts/deploy-production.sh

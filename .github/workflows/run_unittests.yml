name: PawnGuild unit tests

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - name: Test with synthetic in-memory data
        working-directory: services/app
        run: python manage.py test --settings=config.settings.test_sqlite --no-input
      - name: Check for unintended schema changes
        working-directory: services/app
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test_sqlite
      - name: Build and test the production runtime with synthetic data
        run: |
          docker build -t pawnguild-runtime-test services/app
          docker run --rm --network none -e DJANGO_SETTINGS_MODULE=config.settings.test_sqlite pawnguild-runtime-test gunicorn --check-config config.wsgi:application
          docker run --rm --network none pawnguild-runtime-test python manage.py test --settings=config.settings.test_sqlite --no-input
